<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CixEnvios — Calcular envío</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #122033;
        --muted: #5b6b7c;
        --line: #d7e0ea;
        --accent: #0b6e4f;
        --accent-dark: #08543c;
        --bg: #f4f7fb;
        --card: #ffffff;
        --err: #9b1c1c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", system-ui, sans-serif;
        background:
          radial-gradient(circle at top right, #d9f2e8, transparent 40%),
          var(--bg);
        color: var(--ink);
      }

      main {
        max-width: 440px;
        margin: 0 auto;
        padding: 48px 20px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.8rem;
      }

      p.lead {
        margin: 0 0 24px;
        color: var(--muted);
      }

      form {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 12px 32px rgba(18, 32, 51, 0.06);
      }

      label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
      }

      .campo {
        margin-bottom: 16px;
      }

      input,
      select,
      button {
        width: 100%;
        font: inherit;
      }

      input,
      select {
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
      }

      button {
        margin-top: 8px;
        padding: 12px;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        background: var(--accent-dark);
      }

      #resultado {
        margin-top: 16px;
        min-height: 1.4em;
        font-weight: 600;
      }

      #resultado.error {
        color: var(--err);
      }

      #resultado.ok {
        color: var(--accent-dark);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>CixEnvios</h1>
      <p class="lead">Calcule el costo y los días estimados de su envío.</p>
      <form id="formulario">
        <div class="campo">
          <label for="pesoKg">Peso (kg)</label>
          <input
            id="pesoKg"
            name="pesoKg"
            type="number"
            min="0.01"
            step="0.01"
            required
          />
        </div>
        <div class="campo">
          <label for="ciudadDestino">Ciudad de destino</label>
          <select id="ciudadDestino" name="ciudadDestino" required>
            <option value="">Seleccione una ciudad</option>
            <option value="chiclayo">Chiclayo</option>
            <option value="lambayeque">Lambayeque</option>
            <option value="motupe">Motupe</option>
            <option value="trujillo">Trujillo</option>
            <option value="lima">Lima</option>
          </select>
        </div>
        <button type="submit">Calcular envío</button>
        <p id="resultado" aria-live="polite"></p>
      </form>
    </main>
    <script>
      const formulario = document.getElementById("formulario");
      const resultado = document.getElementById("resultado");

      formulario.addEventListener("submit", async (evento) => {
        evento.preventDefault();
        resultado.className = "";
        resultado.textContent = "Calculando…";

        const pesoKg = Number(document.getElementById("pesoKg").value);
        const ciudadDestino = document.getElementById("ciudadDestino").value;

        try {
          const respuesta = await fetch("/api/envios/calcular", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ pesoKg, ciudadDestino }),
          });
          const datos = await respuesta.json();

          if (!respuesta.ok) {
            throw new Error(datos.error || "No se pudo calcular el envío.");
          }

          resultado.className = "ok";
          resultado.textContent =
            "Costo: S/ " +
            Number(datos.costoEnvio).toFixed(2) +
            " · Entrega estimada: " +
            datos.diasEstimados +
            (datos.diasEstimados === 1 ? " día" : " días");
        } catch (error) {
          resultado.className = "error";
          resultado.textContent = error.message;
        }
      });
    </script>
  </body>
</html>
