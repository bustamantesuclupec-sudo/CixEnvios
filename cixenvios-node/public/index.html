<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Calcula el costo y el tiempo estimado de tu envío con CixEnvios."
    />
    <title>CixEnvios | Calcula tu envío</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #172b3a;
        background: #f2f7f5;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        --green: #087a55;
        --green-dark: #056344;
        --muted: #526574;
        --border: #d6e1e6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(ellipse at 85% 10%, #d7f0e5 0, transparent 38%),
          #f2f7f5;
      }

      main {
        width: min(100% - 32px, 480px);
        margin: 0 auto;
        padding: 64px 0;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--green);
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 2.75rem);
        letter-spacing: -0.04em;
      }

      .intro {
        margin: 10px 0 28px;
        color: var(--muted);
        line-height: 1.6;
      }

      form {
        padding: 28px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 18px 48px rgb(23 43 58 / 8%);
      }

      .field {
        margin-bottom: 20px;
      }

      .field-error {
        margin: 6px 0 0;
        color: #a32121;
        font-size: 0.875rem;
      }

      .field-error:empty {
        display: none;
      }

      [aria-invalid="true"] {
        border-color: #a32121;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.95rem;
        font-weight: 650;
      }

      input,
      select {
        width: 100%;
        min-height: 48px;
        padding: 10px 12px;
        border: 1px solid #bdcbd3;
        border-radius: 9px;
        background: #fff;
        color: inherit;
        font: inherit;
      }

      input:focus,
      select:focus,
      button:focus-visible {
        outline: 3px solid rgb(8 122 85 / 25%);
        outline-offset: 2px;
        border-color: var(--green);
      }

      button {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 9px;
        background: var(--green);
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: var(--green-dark);
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      #resultado {
        min-height: 1.5em;
        margin: 18px 0 0;
        font-weight: 650;
        line-height: 1.5;
      }

      #resultado.ok {
        color: var(--green-dark);
      }

      #resultado.error {
        color: #a32121;
      }

      @media (max-width: 480px) {
        main {
          padding: 40px 0;
        }

        form {
          padding: 22px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Envíos simples y claros</p>
      <h1>CixEnvios</h1>
      <p class="intro">Calcula el costo y el tiempo estimado de entrega.</p>

      <form id="formulario" novalidate>
        <div class="field">
          <label for="pesoKg">Peso del paquete (kg)</label>
          <input
            id="pesoKg"
            name="pesoKg"
            type="number"
            min="0.01"
            step="any"
            placeholder="Ej. 2.5"
            aria-describedby="peso-error"
            required
          />
          <p id="peso-error" class="field-error"></p>
        </div>

        <div class="field">
          <label for="ciudadDestino">Ciudad de destino</label>
          <select
            id="ciudadDestino"
            name="ciudadDestino"
            aria-describedby="ciudad-error"
            required
          >
            <option value="">Selecciona una ciudad</option>
            <option value="chiclayo">Chiclayo</option>
            <option value="lambayeque">Lambayeque</option>
            <option value="motupe">Motupe</option>
            <option value="trujillo">Trujillo</option>
            <option value="lima">Lima</option>
          </select>
          <p id="ciudad-error" class="field-error"></p>
        </div>

        <button id="submit" type="submit">Calcular envío</button>
        <p id="resultado" role="status" aria-live="polite"></p>
      </form>
    </main>

    <script>
      const formulario = document.getElementById("formulario");
      const boton = document.getElementById("submit");
      const resultado = document.getElementById("resultado");
      const pesoInput = document.getElementById("pesoKg");
      const ciudadSelect = document.getElementById("ciudadDestino");
      const pesoError = document.getElementById("peso-error");
      const ciudadError = document.getElementById("ciudad-error");

      function mostrarError(campo, contenedor, mensaje) {
        campo.setAttribute("aria-invalid", mensaje ? "true" : "false");
        contenedor.textContent = mensaje;
      }

      function validarFormulario() {
        const pesoTexto = pesoInput.value.trim();
        const pesoKg = Number(pesoTexto);
        const ciudadDestino = ciudadSelect.value;
        let valido = true;

        if (pesoTexto === "") {
          mostrarError(pesoInput, pesoError, "Ingresa el peso del paquete.");
          valido = false;
        } else if (!Number.isFinite(pesoKg) || pesoKg <= 0) {
          mostrarError(
            pesoInput,
            pesoError,
            "El peso debe ser un número mayor que cero."
          );
          valido = false;
        } else {
          mostrarError(pesoInput, pesoError, "");
        }

        if (!ciudadDestino) {
          mostrarError(
            ciudadSelect,
            ciudadError,
            "Selecciona una ciudad de destino."
          );
          valido = false;
        } else {
          mostrarError(ciudadSelect, ciudadError, "");
        }

        if (!valido) {
          (pesoTexto === "" || !Number.isFinite(pesoKg) || pesoKg <= 0
            ? pesoInput
            : ciudadSelect
          ).focus();
        }

        return valido;
      }

      pesoInput.addEventListener("input", () => {
        mostrarError(pesoInput, pesoError, "");
        resultado.className = "";
        resultado.textContent = "";
      });

      ciudadSelect.addEventListener("change", () => {
        mostrarError(ciudadSelect, ciudadError, "");
        resultado.className = "";
        resultado.textContent = "";
      });

      formulario.addEventListener("submit", async (evento) => {
        evento.preventDefault();

        if (!validarFormulario()) {
          return;
        }

        resultado.className = "";
        resultado.textContent = "Calculando…";
        boton.disabled = true;

        try {
          const respuesta = await fetch("/api/envios/calcular", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              pesoKg: Number(pesoInput.value),
              ciudadDestino: ciudadSelect.value,
            }),
          });
          let cuerpo;

          try {
            cuerpo = await respuesta.json();
          } catch {
            throw new Error("El servidor devolvió una respuesta inválida.");
          }

          if (!respuesta.ok) {
            throw new Error(cuerpo.error || "No se pudo calcular el envío.");
          }

          const dias = cuerpo.diasEstimados;
          const costo = Number(cuerpo.costoEnvio);

          if (!Number.isFinite(costo) || !Number.isInteger(dias) || dias < 0) {
            throw new Error("El servidor devolvió datos de cálculo inválidos.");
          }

          resultado.className = "ok";
          resultado.textContent =
            `Costo: S/ ${costo.toFixed(2)} · ` +
            `Entrega estimada: ${dias} ${dias === 1 ? "día" : "días"}`;
        } catch (error) {
          resultado.className = "error";
          resultado.textContent =
            error instanceof TypeError
              ? "No se pudo conectar con la API. Comprueba que el servidor esté activo."
              : error.message;
        } finally {
          boton.disabled = false;
        }
      });
    </script>
  </body>
</html>
